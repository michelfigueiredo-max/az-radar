<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZRadar — Plataforma de Background Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans','Segoe UI',system-ui,sans-serif;background:#F0F4F9;color:#0D1B2E;font-size:13px;-webkit-font-smoothing:antialiased}
:root{
  --navy:#0A1628;--accent:#1D55D4;--accentBg:#EBF1FF;
  --border:#DDE4EE;--surface:#fff;--text:#0D1B2E;
  --textSub:#3D5166;--textMuted:#7D90A5;
  --green:#0F7A3C;--greenBg:#EDFAF3;--greenBorder:#A3E8C0;
  --red:#B91C1C;--redBg:#FEF2F2;--redBorder:#FCA5A5;
  --yellow:#B45309;--yellowBg:#FFFBEB;--yellowBorder:#FCD34D;
  --gray:#64748B;--grayBg:#F8FAFC;
}
button{cursor:pointer;border:none;background:transparent;font-family:inherit;font-size:inherit}

/* ── TOPBAR ── */
#topbar{
  background:var(--navy);height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;position:sticky;top:0;z-index:100;
  gap:12px;border-bottom:1px solid rgba(255,255,255,0.08)
}
#nav-tabs{display:flex;gap:4px;overflow-x:auto}
.nav-btn{
  padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;
  color:rgba(255,255,255,0.48);white-space:nowrap;transition:all .15s
}
.nav-btn.active,.nav-btn:hover{background:rgba(255,255,255,0.18);color:#fff}
#master-btn{
  padding:5px 13px;border-radius:8px;font-size:11px;font-weight:700;
  background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.6);
  white-space:nowrap;flex-shrink:0;transition:all .2s
}
#master-btn.on{background:#EAB308;color:var(--navy)}

/* ── LOGO ── */
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-az{font-family:'Barlow Condensed','Impact',sans-serif;font-weight:900;font-size:18px;color:#fff;letter-spacing:-0.5px}
.logo-az span{color:#60A5FA}
.logo-sub{font-size:7px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,0.42);display:flex;align-items:center;gap:4px;margin-top:1px}

/* ── PERFIL BAR ── */
#perfil-bar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 20px;overflow-x:auto
}
#perfil-tabs{display:flex;align-items:flex-end;gap:0;min-width:max-content}
.pf-label{
  font-size:9px;color:var(--textMuted);letter-spacing:2px;
  text-transform:uppercase;padding:0 8px 11px 0;align-self:flex-end;white-space:nowrap
}
.pf-div{width:1px;background:var(--border);margin:0 6px;height:26px;align-self:flex-end;margin-bottom:9px}
.pf-btn{
  padding:10px 14px;font-size:12px;font-weight:700;color:var(--textMuted);
  border-bottom:2.5px solid transparent;transition:all .15s;
  white-space:nowrap;display:flex;align-items:center;gap:5px
}
.pf-btn.active,.pf-btn:hover{color:var(--pf-cor,#1D55D4)}
.pf-btn.active{border-bottom-color:var(--pf-cor,#1D55D4)}

/* ── VIEWS ── */
.view{display:none;padding:22px;max-width:900px;margin:0 auto}
.view.active{display:block}
@media(max-width:640px){.view{padding:14px 12px}}

/* ── HEADER DOSSIÊ ── */
.dossie-header{
  background:var(--navy);border-radius:12px;padding:20px 24px;
  margin-bottom:14px;display:flex;flex-wrap:wrap;
  align-items:center;justify-content:space-between;gap:12px
}
.rpt-num{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1;margin-bottom:3px}
.rpt-date{font-size:12px;color:#fff;font-weight:600}
.rpt-valid{font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px;text-align:right}

/* ── CARD RESUMO ── */
.summary-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:18px 22px;margin-bottom:14px
}
.summary-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.summary-name{font-size:17px;font-weight:800;color:var(--text);margin-bottom:3px}
.summary-sub{font-size:12px;color:var(--textSub);margin-bottom:2px}
.status-badge{
  display:flex;flex-direction:column;align-items:center;
  border-radius:10px;padding:13px 20px;min-width:110px;
  flex-shrink:0;border-width:1.5px;border-style:solid
}
.status-badge .emoji{font-size:24px;margin-bottom:4px}
.status-badge .lbl{font-size:12px;font-weight:800}
.summary-stats{
  padding-top:12px;border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px
}
.stat-item{text-align:center}
.stat-label{font-size:10px;color:var(--textMuted);margin-bottom:2px}
.stat-val{font-size:15px;font-weight:800;font-family:monospace}
@media(max-width:600px){.summary-stats{grid-template-columns:1fr 1fr}}

/* ── GRUPOS ── */
.grupo-wrap{margin-bottom:8px}
.grupo-hdr{
  width:100%;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;
  padding:13px 17px;display:flex;flex-direction:column;
  gap:6px;text-align:left;transition:border-color .15s;
  border-left-width:4px;border-left-style:solid
}
.grupo-hdr.open{border-radius:10px 10px 0 0}
.grupo-hdr:hover{opacity:.95}
.grupo-hdr-top{display:flex;align-items:center;width:100%;gap:10px}
.grupo-title{font-weight:700;font-size:13px;color:var(--text);flex:1}
.grupo-regra{font-size:11px;color:var(--textMuted);line-height:1.45}
.grupo-body{border-radius:0 0 10px 10px;overflow:hidden;background:var(--surface);border-width:1px;border-style:solid;border-top:none}

/* ── ITENS ── */
.item-row{border-bottom:1px solid var(--border)}
.item-row:last-child{border-bottom:none}
.item-inner{padding:13px 17px;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.chk{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;font-size:13px;font-weight:800;
  border-width:1.5px;border-style:solid
}
.item-content{flex:1;min-width:200px}
.item-label{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px}
.item-result{font-size:11px;font-weight:600;margin-bottom:8px}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:600px){.quads{grid-template-columns:1fr}}
.quad{border-radius:7px;padding:9px 11px}
.quad-title{font-size:9px;color:var(--textMuted);text-transform:uppercase;letter-spacing:1;margin-bottom:4px;font-weight:700}
.quad-text{font-size:11px;color:var(--textSub);line-height:1.55}

/* ── STATUS CLASSES ── */
.s-ok .chk{background:var(--greenBg);border-color:var(--greenBorder);color:var(--green)}
.s-ok .item-result{color:var(--green)}
.s-alerta .chk{background:var(--yellowBg);border-color:var(--yellowBorder);color:var(--yellow)}
.s-alerta .item-result{color:var(--yellow)}
.s-recusa .chk{background:var(--redBg);border-color:var(--redBorder);color:var(--red)}
.s-recusa .item-result{color:var(--red)}

/* ── BADGES ── */
.badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;border-width:1px;border-style:solid}
.b-ok{background:var(--greenBg);color:var(--green);border-color:var(--greenBorder)}
.b-alerta{background:var(--yellowBg);color:var(--yellow);border-color:var(--yellowBorder)}
.b-recusa{background:var(--redBg);color:var(--red);border-color:var(--redBorder)}

/* ── EXPORT BTNS ── */
.export-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.export-btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;border-width:1.5px;border-style:solid;transition:opacity .15s}
.export-btn:hover{opacity:.85}

/* ── FILTROS ── */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filtros input,.filtros select{
  padding:8px 12px;border-radius:8px;border:1px solid var(--border);
  font-size:12px;background:var(--surface);color:var(--text);
  font-family:inherit;flex:1;min-width:140px;outline:none
}
.filtros input:focus,.filtros select:focus{border-color:#1D55D4}

/* ── KPIS ── */
.kpis{display:grid;gap:8px;margin-bottom:14px}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:11px 14px;
  border-left-width:3px;border-left-style:solid
}
.kpi-label{font-size:10px;color:var(--textMuted);margin-bottom:3px}
.kpi-val{font-size:15px;font-weight:800;font-family:monospace}
.kpi-sub{font-size:10px;color:var(--textMuted);margin-top:3px}

/* ── TABELA ── */
.tbl-wrap{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;margin-bottom:12px
}
.tbl-hdr{
  display:grid;padding:9px 16px;background:#F1F5FB;
  border-bottom:1px solid var(--border);font-size:10px;
  color:var(--textMuted);font-weight:700;letter-spacing:1;
  text-transform:uppercase;gap:8px
}
.tbl-row{display:grid;gap:8px;padding:11px 16px;align-items:center;border-bottom:1px solid var(--border)}
.tbl-row:last-child{border-bottom:none}
.tbl-row:nth-child(odd){background:var(--surface)}
.tbl-row:nth-child(even){background:#F8FAFC}
.tbl-name{font-size:12px;font-weight:600;color:var(--text)}
.tbl-sub{font-size:10px;color:var(--textMuted);font-family:monospace;margin-top:1px}
.tbl-muted{font-size:11px;color:var(--textSub)}
.tbl-money{font-size:11px;font-weight:700;font-family:monospace}
.perfil-pill{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700}
.confid{font-size:9px;background:var(--navy);color:#fff;padding:2px 8px;border-radius:10px;font-weight:700;letter-spacing:1}

/* ── MASTER KPIS ── */
.master-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
@media(max-width:700px){.master-kpis{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}}
@media(min-width:701px){.kpis{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

let perfilAtivo='motorista';
let isMaster=false;
let gruposAbertos={};

function showView(name,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  document.getElementById('perfil-bar').style.display=(name==='dossie')?'block':'none';
}

function toggleMaster(){
  isMaster=!isMaster;
  const btn=document.getElementById('master-btn');
  btn.textContent=isMaster?'🔐 MASTER':'🔒 Master';
  btn.classList.toggle('on',isMaster);
  document.querySelectorAll('.master-only').forEach(el=>el.style.display=isMaster?'':'none');
  if(!isMaster&&document.getElementById('view-master').classList.contains('active')){
    showView('dossie',document.querySelector('.nav-btn'));
  }
  renderDossie(false);
  renderHistorico();
  renderMaster();
}

function setPerfil(id,btn){
  perfilAtivo=id;
  document.querySelectorAll('.pf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  gruposAbertos={};
  renderDossie();
}

function toggleGrupo(gi){
  gruposAbertos[gi]=!gruposAbertos[gi];
  renderDossie(false);
}

function sInfo(s){return{ok:{label:'Aprovado',icon:'✓',cor:'#0F7A3C',bg:'#EDFAF3',bc:'#A3E8C0'},alerta:{label:'Atenção',icon:'!',cor:'#B45309',bg:'#FFFBEB',bc:'#FCD34D'},recusa:{label:'Recusado',icon:'✕',cor:'#B91C1C',bg:'#FEF2F2',bc:'#FCA5A5'}}[s]||{label:'Aprovado',icon:'✓',cor:'#0F7A3C',bg:'#EDFAF3',bc:'#A3E8C0'}}

function calcStatus(grupos){
  if(grupos.some(g=>g.itens.some(i=>i.status==='recusa')))return'recusa';
  if(grupos.some(g=>g.itens.some(i=>i.status==='alerta')))return'alerta';
  return'ok';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderDossie(resetOpen=true){
  const p=PERFIS[perfilAtivo];
  if(resetOpen) p.grupos.forEach((_,i)=>gruposAbertos[i]=true);

  const totalObrig=all.filter(i=>i.obrig).length;

  const totalCob=all.reduce((a,i)=>a+(i.cobrado||0),0);
  const stGeral=calcStatus(p.grupos);

    </div>
  </div>`;

  p.grupos.forEach((g,gi)=>{
    const ab=gruposAbertos[gi]!==false;

  h+=`<div class="export-btns">
    <button class="export-btn" style="color:#1D55D4;border-color:#1D55D450;background:#EBF1FF">📄 Exportar PDF</button>

  </div>`;

  document.getElementById('view-dossie').innerHTML=h;
}

function renderHistorico(){
  const busca=(document.getElementById('hist-busca')||{}).value||'';
  const tipo=(document.getElementById('hist-tipo')||{}).value||'';
  const status=(document.getElementById('hist-status')||{}).value||'';
  const f=HISTORICO.filter(h=>{
    const b=!busca||h.doc.includes(busca)||h.nome.toLowerCase().includes(busca.toLowerCase())||h.cliente.toLowerCase().includes(busca.toLowerCase());
    return b&&(!tipo||h.tipo===tipo)&&(!status||h.status===status);
  });
  const totalCob=f.reduce((a,h)=>a+h.cobrado,0);
  const totalApi=f.reduce((a,h)=>a+h.custo_api,0);

  const kEl=document.getElementById('hist-kpis');
  if(kEl){
    const cols=isMaster?'repeat(4,1fr)':'repeat(3,1fr)';
    kEl.style.gridTemplateColumns=cols;
    let k=`<div class="kpi-card" style="border-left-color:#1D55D4"><div class="kpi-label">Consultas</div><div class="kpi-val" style="color:#1D55D4">${f.length}</div></div>
    <div class="kpi-card" style="border-left-color:#0F7A3C"><div class="kpi-label">Receita</div><div class="kpi-val" style="color:#0F7A3C">R$ ${totalCob.toFixed(2)}</div></div>`;
    if(isMaster){
      k+=`<div class="kpi-card" style="border-left-color:#B45309"><div class="kpi-label">Custo de API</div><div class="kpi-val" style="color:#B45309">R$ ${totalApi.toFixed(2)}</div></div>
      <div class="kpi-card" style="border-left-color:#0F7A3C"><div class="kpi-label">Margem</div><div class="kpi-val" style="color:#0F7A3C">${totalCob>0?Math.round((totalCob-totalApi)/totalCob*100)+'%':'—'}</div></div>`;
    }else{
      k+=`<div class="kpi-card" style="border-left-color:#0F7A3C"><div class="kpi-label">Status OK</div><div class="kpi-val" style="color:#0F7A3C">${f.filter(h=>h.status==='ok').length}</div></div>`;
    }
    kEl.innerHTML=k;
  }

  const colD=isMaster?'90px 1fr 120px 90px 60px 90px 80px 75px':'90px 1fr 120px 90px 60px 90px';
  let t=`<div class="tbl-wrap"><div class="tbl-hdr" style="grid-template-columns:${colD}">
    <span>Data</span><span>Nome / Doc</span><span>Cliente</span><span>Perfil</span><span>Itens</span><span>Valor</span>
    ${isMaster?'<span>Custo API</span><span>Margem</span>':''}
  </div>`;
  f.forEach((h,i)=>{
    const S=sInfo(h.status);
    const P=PM[h.tipo];
    const m=h.cobrado-h.custo_api;
    const pct=h.cobrado>0?Math.round(m/h.cobrado*100):0;
    t+=`<div class="tbl-row" style="grid-template-columns:${colD};background:${i%2===0?'#fff':'#F8FAFC'}">
      <span class="tbl-muted">${h.data}</span>
      <div><div class="tbl-name">${esc(h.nome)}</div><div class="tbl-sub">${h.doc}</div></div>
      <span class="tbl-muted">${esc(h.cliente)}</span>
      <div class="perfil-pill" style="color:${P.cor}"><span>${P.emoji}</span><span>${P.nome}</span></div>
      <span class="tbl-muted" style="text-align:center">${h.itens}</span>
      <div style="display:flex;align-items:center;gap:5px">
        <span class="tbl-money" style="color:#1D55D4">${h.cobrado>0?'R$ '+h.cobrado.toFixed(2):'Próprio'}</span>
        <span class="badge b-${h.status}" style="font-size:9px;padding:1px 5px">${S.icon}</span>
      </div>
      ${isMaster?`<span class="tbl-money" style="color:#B45309">R$ ${h.custo_api.toFixed(2)}</span>
      <span class="tbl-money" style="color:${pct>50?'#0F7A3C':'#B45309'}">${h.cobrado>0?pct+'%':'—'}</span>`:''}
    </div>`;
  });
  t+='</div>';
  const tEl=document.getElementById('hist-tabela');
  if(tEl) tEl.innerHTML=t;
}

function renderMaster(){
  const totalR=HISTORICO.reduce((a,h)=>a+h.cobrado,0);
  const totalC=HISTORICO.reduce((a,h)=>a+h.custo_api,0);
  const totalM=totalR-totalC;
  const pago=HISTORICO.filter(h=>h.cobrado>0);
  const kEl=document.getElementById('master-kpis');
  if(kEl) kEl.innerHTML=`
    <div class="kpi-card" style="border-left-color:#0F7A3C"><div class="kpi-label">Receita total</div><div class="kpi-val" style="color:#0F7A3C">R$ ${totalR.toFixed(2)}</div><div class="kpi-sub">${HISTORICO.length} consultas</div></div>
    <div class="kpi-card" style="border-left-color:#B45309"><div class="kpi-label">Custo de API</div><div class="kpi-val" style="color:#B45309">R$ ${totalC.toFixed(2)}</div><div class="kpi-sub">Efetivo</div></div>
    <div class="kpi-card" style="border-left-color:#1D55D4"><div class="kpi-label">Margem bruta</div><div class="kpi-val" style="color:#1D55D4">R$ ${totalM.toFixed(2)}</div><div class="kpi-sub">${Math.round(totalM/totalR*100)}%</div></div>
    <div class="kpi-card" style="border-left-color:#1E3A5F"><div class="kpi-label">Ticket médio</div><div class="kpi-val" style="color:#1E3A5F">R$ ${(totalR/pago.length).toFixed(2)}</div><div class="kpi-sub">Dossiês pagos</div></div>`;

  const cli={};
  HISTORICO.forEach(h=>{
    if(!cli[h.cliente])cli[h.cliente]={c:h.cliente,n:0,cob:0,api:0};
    cli[h.cliente].n++;cli[h.cliente].cob+=h.cobrado;cli[h.cliente].api+=h.custo_api;
  });
  const lista=Object.values(cli).sort((a,b)=>b.cob-a.cob);
  let t=`<div class="tbl-wrap"><div class="tbl-hdr" style="grid-template-columns:1fr 70px 85px 80px 80px 65px">
    <span>Cliente</span><span>Cons.</span><span>Receita</span><span>Custo API</span><span>Margem R$</span><span>%</span>
  </div>`;
  lista.forEach((c,i)=>{
    const m=c.cob-c.api;const pct=c.cob>0?Math.round(m/c.cob*100):0;
    t+=`<div class="tbl-row" style="grid-template-columns:1fr 70px 85px 80px 80px 65px;background:${i%2===0?'#fff':'#F8FAFC'}">
      <span class="tbl-name">${esc(c.c)}</span>
      <span class="tbl-muted" style="text-align:center">${c.n}</span>
      <span class="tbl-money" style="color:#1D55D4">${c.cob>0?'R$ '+c.cob.toFixed(2):'Próprio'}</span>
      <span class="tbl-money" style="color:#B45309">R$ ${c.api.toFixed(2)}</span>
      <span class="tbl-money" style="color:${m>0?'#0F7A3C':'#64748B'}">${c.cob>0?'R$ '+m.toFixed(2):'—'}</span>
      <span class="tbl-money" style="color:${pct>50?'#0F7A3C':'#B45309'}">${c.cob>0?pct+'%':'—'}</span>
    </div>`;
  });
  t+='</div>';
  const tEl=document.getElementById('master-tabela');
  if(tEl) tEl.innerHTML=t;
}

renderDossie();
renderHistorico();
renderMaster();
</script>
</body>
</html>
